# nginx im Container: liefert die statische Seite aus
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Videos und Bilder mit langem Cache
    location ~* \.(mp4|jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Sauberer 404 (fällt auf Startseite zurück wäre auch möglich)
    error_page 404 /index.html;
}
